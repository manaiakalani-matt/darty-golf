name: Deploy Darty Golf API

# Publishes the Cloudflare Worker and applies any new database migrations
# whenever server code changes on main.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Check for Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set, so the Worker was not deployed. See README > Deploying."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply database migrations and deploy
        if: steps.token.outputs.present == 'true'
        run: npm run worker:deploy
